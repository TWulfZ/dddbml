<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>dddbml harness</title>
<link href="webview/codicon.css" rel="stylesheet" />
<style>
  /* Stand-ins for the --vscode-* theme variables VS Code injects into a real webview (Dark Modern-ish). */
  :root {
    --vscode-font-family: system-ui, sans-serif; --vscode-font-size: 13px; --vscode-editor-font-family: monospace;
    --vscode-foreground: #cccccc; --vscode-editor-background: #1e1e1e; --vscode-editor-foreground: #d4d4d4;
    --vscode-focusBorder: #007fd4; --vscode-button-background: #0e639c; --vscode-button-foreground: #fff;
    --vscode-button-hoverBackground: #1177bb; --vscode-input-background: #3c3c3c; --vscode-input-foreground: #ccc;
    --vscode-input-border: #555; --vscode-dropdown-background: #3c3c3c; --vscode-widget-border: #454545;
    --vscode-panel-border: #444; --vscode-sideBar-background: #252526; --vscode-editorWidget-background: #252526;
    --vscode-menu-background: #252526; --vscode-menu-foreground: #ccc; --vscode-list-hoverBackground: #2a2d2e;
    --vscode-descriptionForeground: #9d9d9d; --vscode-textLink-foreground: #3794ff; --vscode-errorForeground: #f48771;
    --vscode-charts-blue: #3794ff; --vscode-charts-green: #89d185; --vscode-charts-red: #f14c4c;
    --vscode-charts-yellow: #cca700; --vscode-charts-orange: #d18616; --vscode-charts-purple: #b180d7;
    --vscode-diffEditor-insertedTextBackground: #9ccc2c33; --vscode-diffEditor-removedTextBackground: #ff000033;
  }
  html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: var(--vscode-font-family); color: var(--vscode-foreground); background: var(--vscode-editor-background); }
</style>
<script>
  // Fake host: records every webview→host message in window.__posted and, on 'ready', replays the
  // same hydrate sequence as panel.ts (layout first, then schema, theme, settings).
  window.__posted = [];
  window.__deliver = (m) => window.dispatchEvent(new MessageEvent('message', { data: m }));
  const fixture = new URLSearchParams(location.search).get('fixture') || 'small';
  window.__fixtureReady = fetch(fixture + '.json').then((r) => r.json()).then((f) => (window.__fixture = f));
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      window.__posted.push(m);
      if (m.type !== 'ready') return;
      window.__fixtureReady.then((f) => {
        __deliver({ type: 'layout:loaded', payload: f.layout });
        __deliver({ type: 'schema:update', payload: { schema: f.schema, parseError: null } });
        __deliver({ type: 'theme:change', payload: { kind: 'dark' } });
        __deliver({ type: 'settings:loaded', payload: f.settings });
        window.__hydrated = true;
      });
    },
    getState() { return window.__state; },
    setState(s) { window.__state = s; },
  });
</script>
</head>
<body><div id="root"></div><script src="webview/webview.js"></script></body>
</html>
